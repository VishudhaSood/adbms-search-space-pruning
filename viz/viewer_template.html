    --pg: #3987e5; --cal: #d95926; --alive: #199e70; --evicted: #c98500; --rejected: #d55181;

<div class="wrap">
  <header>
    <h1>Search Space Viewer</h1>
    <p class="sub">How PostgreSQL (System R style dynamic programming) and Calcite (Volcano memo) explore join plans for the same query on our test tables a–e. Built from <code>traces/</code> by <code>viz/build_viewer.py</code>.</p>
    <div class="controls">
      <div class="group" id="qbtns"><span class="lab">Query</span></div>
      <div class="group" id="vbtns"><span class="lab">View</span></div>
      <div class="group" id="mbtns"><span class="lab">PostgreSQL</span></div>
      <div class="group" id="cbtns"><span class="lab">Calcite</span></div>
    </div>
    <div class="sql" id="sql"></div>
    <div class="tleg" id="tleg"></div>
  </header>
  <main id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>

    const a = per[s] || (per[s] = { P: 0, R: 0, E: 0, K: 0, B: 0 });

    const lab = el("text", { x: x + 8, y: y + 20, "font-size": 12.5, "font-weight": 600, fill: a ? css("--ink") : css("--ink-3"), "font-family": css("--font-mono") }, g);
    const tl = orders[s] || s.split(",");
    lab.textContent = "";
    const ap = (txt, fill) => { const sp = el("tspan", fill ? { fill } : {}, lab); sp.textContent = txt; };
    ap("{"); tl.forEach((t, i) => { if (i) ap(","); ap(t, tcol(t)); }); ap("}");
    strip(g, x + 1, y + 1, BW - 2, 7, tl);
    if (!isConn) { const c = el("text", { x: x + BW - 8, y: y + 20, "text-anchor": "end", "font-size": 10, fill: css("--cross"), "font-weight": 600 }, g); c.textContent = "no join cond."; }
    if (!a) { const t = el("text", { x: x + 8, y: y + 40, "font-size": 11.5, fill: css("--ink-3") }, g); t.textContent = "not explored"; }
    else {
      let segs, total, line;
      if (pg) {
        const alive = limit == null ? (pg.retained[s] ?? a.alive) : a.alive;
        segs = [["--precheck", a.P], ["--rejected", a.R], ["--evicted", a.E], ["--alive", alive]];
        total = a.P + a.R + a.K; line = `${total} costed · ${alive} kept`;
      } else {
        const win = limit == null ? a.W : 0;
        segs = [["--logical", a.L], ["--cal", a.Ph - win], ["--alive", win]];
        total = a.L + a.Ph; line = `${total} node${total === 1 ? "" : "s"} · ${a.nsets} RelSet${a.nsets > 1 ? "s" : ""}`;
      }
      const sum = segs.reduce((m, z) => m + z[1], 0) || 1; let bx = x + 8; const bw = BW - 16;

      const t = el("text", { x: x + 8, y: y + 52, "font-size": 11.5, fill: css("--ink-2"), "font-family": css("--font-mono") }, g); t.textContent = line;

      if (a.B) badges.push([`bushy tried ×${a.B}`, "--precheck"]);
      let bx2 = x + 8;
      for (const [txt, c] of badges) {
        const w = Math.min(BW - 16, 7 + txt.length * 6.1);
        if (bx2 + w > x + BW - 4) break;
        el("rect", { x: bx2, y: y + 60, width: w, height: 14, rx: 3, fill: css(c), opacity: 0.16 }, g);
        const bt = el("text", { x: bx2 + 4, y: y + 71, "font-size": 10, "font-weight": 600, fill: css(c) }, g); bt.textContent = txt;

      const so = sortedOn(pg, a, s, limit, st), order = orders[s] ? `<br>join order in the plan: ${orders[s].join(" → ")}` : "";
      const extra = (so ? `<br><b>interesting order</b>: a path sorted on ${so} is kept` : "") + (a.B ? `<br><b>bushy</b> candidates (a join on both sides): ${a.B}` : "") + order;
      if (pg) { const alive = limit == null ? (pg.retained[s] ?? a.alive) : a.alive; return `<b>${setLabel(s)}</b><br>pruned before building: ${a.P}<br>rejected on arrival: ${a.R}<br>evicted later: ${a.E}<br>kept: ${alive}` + extra; }
      return `<b>${setLabel(s)}</b><br>RelSets: ${a.nsets}<br>logical nodes: ${a.L}<br>physical nodes: ${a.Ph}` + (limit == null ? `<br>winners: ${a.W}` : "") + extra + (isConn ? "" : "<br><b>cross product</b>: PostgreSQL never builds this set");
    };
    g.addEventListener("mousemove", e => showTip(e, tipHtml())); g.addEventListener("mouseleave", hideTip);
    const pick = () => { S.sel = { kind, set: s }; renderDetail(); };
    g.addEventListener("click", pick); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  }
  container.appendChild(svg);
}

/* ---------- plan tree drawing ---------- */
function drawTree(container, tree, kind) {
  if (!tree) { container.appendChild(h("p", { class: "empty" }, "No complete plan yet at this step.")); return; }
  const NW = 136, NH = 46, HG = 14, VG = 26;
  let leaf = 0; const nodes = [];
  (function lay(n, d) {
    const kids = (n.c || []).filter(Boolean);
    let x;
    if (!kids.length) x = leaf++ * (NW + HG);
    else { const xs = kids.map(c => lay(c, d + 1)); x = (xs[0] + xs[xs.length - 1]) / 2; }
    nodes.push({ n, d, x, kids: kids.length ? kids : [] }); n._x = x; n._d = d; return x;
  })(tree, 0);
  const depth = Math.max(...nodes.map(z => z.d)) + 1;
  const W = Math.max(leaf, 1) * (NW + HG) - HG + 4, H = depth * (NH + VG) - VG + 4;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "plan tree" });
  const accent = css(kind === "pg" ? "--pg" : "--cal");
  for (const z of nodes) for (const c of z.kids) {
    el("line", { x1: z.x + NW / 2 + 2, y1: z.d * (NH + VG) + NH + 2, x2: c._x + NW / 2 + 2, y2: c._d * (NH + VG) + 2, stroke: css("--line-2"), "stroke-width": 1.5 }, svg);
  }
  for (const z of nodes) {
    const x = z.x + 2, y = z.d * (NH + VG) + 2; const n = z.n;
    const isJoin = /Join|Loop/.test(n.o || "");
    el("rect", { x, y, width: NW, height: NH, rx: 5, fill: css("--panel"), stroke: isJoin ? accent : css("--line-2"), "stroke-width": isJoin ? 1.8 : 1 }, svg);
    strip(svg, x + 1, y + 1, NW - 2, 8, leafOrder(n));          // its tables' colours, outer side first
    const t1 = el("text", { x: x + 8, y: y + 21, "font-size": 12, "font-weight": 600, fill: css("--ink") }, svg);
    const name = (n.o || "?") + (n.tb ? " " + n.tb : (!isJoin && n.s ? " " + n.s : ""));
    t1.textContent = name.length > 20 ? name.slice(0, 19) + "…" : name;
    const t2 = el("text", { x: x + 8, y: y + 38, "font-size": 11, fill: css("--ink-2"), "font-family": css("--font-mono") }, svg);
    t2.textContent = n.t != null ? `${fmt(n.t)} · ${fmtR(n.r)} rows` : "";
  }
  container.appendChild(svg);
}

/* ---------- views ---------- */

function legendCal(final) { return `<div class="legend"><span><i class="sw" style="background:var(--logical)"></i>logical node</span><span><i class="sw" style="background:var(--cal)"></i>physical node</span>${final ? '<span><i class="sw" style="background:var(--alive)"></i>winner (best in its RelSet)</span>' : ""}</div>`; }

function pgStats(pg) { const s = pg.summary; return `<div class="stats"><span>costed <b>${s.considered}</b></span><span>built <b>${s.built}</b></span><span>precheck <b>${s.pruned_precheck}</b></span><span>rejected <b>${s.pruned_on_arrival}</b></span><span>evicted <b>${s.evicted_later}</b></span><span>kept <b>${s.retained}</b></span><span>sets <b>${s.sets_built}</b></span></div>`; }

function renderDetail() {

/* ---------- replay clock ----------
   Real time: every event is placed at the moment it happened, in µs since that optimizer's search started,
   then scaled so the whole trace lasts the UNTRACED planning time (tracing itself slows planning down):
       t_shown = t × (untraced planning time / last t of this trace)
   Both engines share one clock, so a ~1 ms PostgreSQL search and a ~70 ms Calcite search look as different as they are. */
function pgTimes(pg) {
  const last = pg.timing && pg.timing.last_t_us, un = pg.timing && pg.timing.untraced_ms;
  const sc = last && un ? un * 1000 / last : 1;
  return { t: pg.ev.map(e => (e[9] == null ? 0 : e[9]) * sc), end: un ? un * 1000 : (last || 0), scaled: !!(last && un) };
}
function calTimes(cal) {
  const last = cal.timing && cal.timing.last_t_us, un = cal.timing && cal.timing.untraced_ms;
  const sc = last && un ? un * 1000 / last : 1;
  const none = !(cal.times || []).some(v => v != null);
  return { t: (cal.times || []).map(v => (v == null ? 0 : v) * sc), end: none ? 0 : (un ? un * 1000 : last), scaled: !!(last && un), none };
}
const countUpTo = (arr, tu) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= tu) lo = m + 1; else hi = m; } return lo; };
const ms = us => us >= 1000 ? (us / 1000).toFixed(us >= 1e5 ? 0 : 2) + " ms" : us.toFixed(0) + " µs";

function viewSteps(main) {
  const q = Q(); const pg = q[S.mode], cal = q.cal;
  const PT = pg ? pgTimes(pg) : null, CT = cal ? calTimes(cal) : null;
  const END = Math.max(PT ? PT.end : 0, CT ? CT.end : 0) || 1;
  if (S.tu == null || S.tu > END) S.tu = END;
  const bar = h("div", { class: "stepbar" });
  const speeds = [[1, "1×"], [0.1, "0.1×"], [0.01, "0.01×"], [0.001, "0.001×"]];
  bar.innerHTML = `<button class="chip" id="play" aria-pressed="false">${S.playing ? "Pause" : "Play"}</button><button class="chip" id="back">◀ step</button><button class="chip" id="fwd">step ▶</button>
    <input type="range" id="slider" min="0" max="1000" value="${S.clock !== "steps" ? Math.round(S.tu / END * 1000) : S.p}" aria-label="Search progress">
    <span class="group"><span class="lab">Clock</span><button class="chip" data-clock="real" aria-pressed="${S.clock === "real"}" title="one shared clock: true speed difference">real time, shared</button><button class="chip" data-clock="own" aria-pressed="${S.clock === "own"}" title="each engine on its own real clock, stretched to the same length">real time, each own</button><button class="chip" data-clock="steps" aria-pressed="${S.clock === "steps"}">% of steps</button></span>
    <span class="group" id="spd" ${S.clock !== "steps" ? "" : "hidden"}><span class="lab">Speed</span>${speeds.map(([v, l]) => `<button class="chip" data-speed="${v}" aria-pressed="${S.speed === v}">${l}</button>`).join("")}</span>
    <span class="clock" id="pct"></span>`;
  main.appendChild(bar);
  main.appendChild(h("p", { class: "note" }, S.clock === "real"
    ? `<b>Real time, shared clock:</b> both searches on one clock, at their measured <b>untraced</b> planning speed (logging slows planning, so trace times are scaled down to it). A short PostgreSQL search finishes almost at once next to Calcite: that gap is the result. At 0.01×, 1 ms of planning takes 0.1 s to play; use 0.001× or "each own" to watch PostgreSQL build.`
    : S.clock === "own"
    ? `<b>Real time, each on its own clock:</b> each engine's events keep their real spacing, but each search is stretched to the same length, so you can watch both build. The clock shows how far into its own planning time each engine is.`
    : "Both searches play on the same progress scale (0–100% of each optimizer's own steps). Watch the order: PostgreSQL fills the lattice left to right; Calcite jumps between levels as rules fire, and its best plan improves as cheaper alternatives appear."));
  const cols = h("div", { class: "cols" });
  const p1 = h("section", { class: "panel" }); const p2 = h("section", { class: "panel" });
  cols.append(p1, p2); main.appendChild(cols);
  const fin = h("section", { class: "panel" }); main.appendChild(fin);
  function ks() {
    if (S.clock === "real") return { kp: PT ? countUpTo(PT.t, S.tu) : 0, kc: CT ? (CT.none ? cal.order.length : countUpTo(CT.t, S.tu)) : 0 };
    if (S.clock === "own") { const f = S.tu / END; return { kp: PT ? countUpTo(PT.t, f * PT.end) : 0, kc: CT ? (CT.none ? cal.order.length : countUpTo(CT.t, f * CT.end)) : 0 }; }
    const p = S.p / 1000; return { kp: pg ? Math.round(p * pg.ev.length) : 0, kc: cal ? Math.round(p * cal.order.length) : 0 };
  }
  function paint() {
    const { kp, kc } = ks();
    const f = S.tu / END;
    $("#pct").innerHTML = S.clock === "real" ? `⏱ ${ms(S.tu)} <span class="stats" style="display:inline">/ ${ms(END)}</span>`
      : S.clock === "own" ? `<span style="color:var(--pg)">${PT ? ms(f * PT.end) : "–"}</span> · <span style="color:var(--cal)">${CT && !CT.none ? ms(f * CT.end) : "–"}</span>`
      : `${Math.round(S.p / 10)}%`;
    p1.innerHTML = `<div class="ph"><h2><i class="dot" style="background:var(--pg)"></i>PostgreSQL</h2>${PT ? `<span class="stats">planning ${ms(PT.end)}${PT.scaled ? "" : " (traced, unscaled)"}</span>` : ""}</div>`;
    if (pg) {
      const k = kp; const e = pg.ev[k - 1];
      const name = { P: "pruned before building", R: "rejected on arrival", E: "evicted (a newer path beat it)", K: "kept" };
      const done = k >= pg.ev.length ? ` · <b>done</b>` : "";
      p1.insertAdjacentHTML("beforeend", `<div class="stats"><span>step <b>${k}</b> / ${pg.ev.length}${done}</span></div><div class="evt">${e ? `${e[1]} for ${setLabel(e[0])}${e[2].length ? " = " + e[2].map(setLabel).join(" ⋈ ") : ""} · cost ${fmt(e[4])} → <b>${name[e[8]]}</b>${e[10] ? ` · sorted on ${e[10]}` : ""}` : "start"}</div>` + legendPg());
      const sc = h("div", { class: "scroll" }); drawLattice(sc, q, "pg", k); p1.appendChild(sc);
      const st = pgState(pg, k); const dn = Object.keys(st.active).filter(s => st.active[s].length);
      const top = dn.sort((a, b) => b.split(",").length - a.split(",").length || (pgBest(st.active, a).t - pgBest(st.active, b).t))[0];
      p1.insertAdjacentHTML("beforeend", `<h3 style="margin:4px 0 0;font-size:13px">Best plan so far ${top ? "for " + setLabel(top) : ""}</h3>`);
      const t = h("div", { class: "scroll" }); drawTree(t, top ? pgTreeAt(st.active, top) : null, "pg"); p1.appendChild(t);
    }
    p2.innerHTML = `<div class="ph"><h2><i class="dot" style="background:var(--cal)"></i>Calcite · ${cmodeLabel(q)}</h2>${CT ? `<span class="stats">${CT.none ? "this trace has no timestamps (older run): shown finished; use “% of steps” or re-run this mode" : "planning " + ms(CT.end) + (CT.scaled ? "" : " (traced, unscaled)")}</span>` : ""}</div>`;
    if (cal) {
      const k = kc; const id = cal.order[k - 1]; const nd = cal.nodes.find(n => n[0] === id);
      const done = k >= cal.order.length ? ` · <b>done</b>` : "";
      p2.insertAdjacentHTML("beforeend", `<div class="stats"><span>step <b>${k}</b> / ${cal.order.length}${done}</span></div><div class="evt">${nd ? `${nd[1]} added to RelSet ${nd[3]} ${setLabel(cal.sets[nd[3]] || "?")} by ${nd[10] || "initial"}${nd[11] && nd[11].length ? ` · sorted on ${nd[11].join(", ")}` : ""}` : "start"}</div>` + legendCal(false));
      const sc = h("div", { class: "scroll" }); drawLattice(sc, q, "cal", k); p2.appendChild(sc);
      const snap = [...cal.timeline].reverse().find(s => s.step <= k);
      p2.insertAdjacentHTML("beforeend", `<h3 style="margin:4px 0 0;font-size:13px">Best full plan so far ${snap ? "· total " + fmt(snap.t) : ""} <span class="stats" style="display:inline">(${cal.timeline.filter(s => s.step <= k).length} of ${cal.timeline.length} improvements)</span></h3>`);
      const t = h("div", { class: "scroll" }); drawTree(t, snap && snap.plan, "cal"); p2.appendChild(t);
    }
    // 3. at the end: planning and execution time
    const finished = (!pg || kp >= pg.ev.length) && (!cal || kc >= cal.order.length);
    const ex = q.exec || {}; const cm = calMode(q);
    const calExec = ex.cal && ex.cal[cm] != null ? ex.cal[cm] : (ex.pg != null && cal && pg && planShape(cal.plan) && sameOrder(pg.plan, cal.plan) ? ex.pg : null);
    fin.style.display = finished ? "" : "none";
    fin.innerHTML = `<div class="ph"><h2>Replay finished</h2><span class="stats">planning = untraced median · execution = EXPLAIN ANALYZE median</span></div>
      <div class="done"><div><span class="lab" style="color:var(--pg)">PostgreSQL</span><br>planning <b>${PT ? ms(PT.end) : "–"}</b><br>execution <b>${ex.pg != null ? ex.pg.toFixed(2) + " ms" : "– (run tools/exec_times.py)"}</b></div>
      <div><span class="lab" style="color:var(--cal)">Calcite · ${cmodeLabel(q)}</span><br>planning <b>${CT && !CT.none ? ms(CT.end) : "–"}</b><br>execution of its plan on PostgreSQL <b>${calExec != null ? calExec.toFixed(2) + " ms" : "–"}</b>${ex.cal && ex.cal[cm] != null ? " (forced with pg_lab, task iii)" : calExec != null ? " (same plan as PostgreSQL)" : ""}</div></div>`;
  }
  const slider = $("#slider", bar);
  const sync = () => { slider.value = S.clock !== "steps" ? Math.round(S.tu / END * 1000) : S.p; };
  slider.addEventListener("input", () => { if (S.clock !== "steps") S.tu = +slider.value / 1000 * END; else S.p = +slider.value; paint(); });
  const stepBy = d => {
    if (S.clock !== "steps") {   // jump to the next / previous event of either engine
      const sp = S.clock === "own" ? [PT ? END / (PT.end || 1) : 1, CT ? END / (CT.end || 1) : 1] : [1, 1];
      const all = [...(PT ? PT.t.map(v => v * sp[0]) : []), ...(CT && !CT.none ? CT.t.map(v => v * sp[1]) : [])].sort((a, b) => a - b);
      if (d > 0) { const nx = all.find(v => v > S.tu + 1e-9); S.tu = nx == null ? END : nx; }
      else { const pv = [...all].reverse().find(v => v < S.tu - 1e-9); S.tu = pv == null ? 0 : pv; }
    } else { const n = Math.max(pg ? pg.ev.length : 0, cal ? cal.order.length : 0) || 1; S.p = Math.max(0, Math.min(1000, S.p + d * 1000 / n)); }
    sync(); paint();
  };
  $("#back", bar).addEventListener("click", () => stepBy(-1)); $("#fwd", bar).addEventListener("click", () => stepBy(1));
  bar.querySelectorAll("[data-clock]").forEach(b => b.addEventListener("click", () => { S.clock = b.dataset.clock; render(); }));
  bar.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => { S.speed = +b.dataset.speed; bar.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  $("#play", bar).addEventListener("click", () => {
    if (S.playing) { cancelAnimationFrame(S.playing); S.playing = null; $("#play").textContent = "Play"; return; }
    if (S.clock !== "steps" ? S.tu >= END : S.p >= 1000) { S.tu = 0; S.p = 0; }
    $("#play").textContent = "Pause";
    let last = performance.now();
    const tick = now => {
      const dt = now - last; last = now;
      if (S.clock !== "steps") S.tu = Math.min(END, S.tu + dt * 1000 * S.speed); else S.p = Math.min(1000, S.p + dt * 0.13);
      sync(); paint();
      const end = S.clock !== "steps" ? S.tu >= END : S.p >= 1000;
      if (end) { S.playing = null; $("#play").textContent = "Play"; } else S.playing = requestAnimationFrame(tick);
    };
    S.playing = requestAnimationFrame(tick);
  });
  paint();
}
/* same join tree, ignoring operators: then PostgreSQL's execution time stands for both */
function treeKey(n) { n = down(n); if (!n) return ""; const k = (n.c || []).filter(Boolean); if (k.length < 2) return leafOrder(n).join(","); return "(" + k.map(treeKey).join(" ") + ")"; }
function sameOrder(a, b) { return a && b && treeKey(a) === treeKey(b); }

function viewCounts(main) {
  const qs = DATA.queries;
  const family = ["Q1", "Q3", "Q4", "Q6", "Q7"].map(id => qs.find(x => x.q === id)).filter(Boolean);
  const mk = S.mode;
  const pts = family.map(x => ({ q: x.q, n: queryTables(x).length,
    pgC: x[mk] && x[mk].summary.considered, pgK: x[mk] && x[mk].summary.retained,
    calR: calOf(x) && calOf(x).summary.registered, calW: calOf(x) && calOf(x).summary.winners }));
  const last = pts[pts.length - 1];
  if (last) main.insertAdjacentHTML("beforeend", `<div class="kpi"><div><div class="k">PostgreSQL costed · ${last.n} tables</div><div class="v">${last.pgC ?? "–"}</div></div><div><div class="k">PostgreSQL kept</div><div class="v">${last.pgK ?? "–"}</div></div><div><div class="k">Calcite nodes · ${last.n} tables</div><div class="v">${last.calR ?? "–"}</div></div><div><div class="k">Calcite winners</div><div class="v">${last.calW ?? "–"}</div></div></div>`);
  const panel = h("section", { class: "panel" });
  panel.innerHTML = `<div class="ph"><h2>Plans generated vs kept, by number of tables</h2><span class="stats">${family.map(x => x.q).join(" · ")} (all with a.x = 3) · log scale</span></div>
  <div class="legend"><span><i class="sw" style="background:var(--pg)"></i>PostgreSQL paths costed (solid) / kept (dashed)</span><span><i class="sw" style="background:var(--cal)"></i>Calcite nodes in memo (solid) / winners (dashed)</span></div>`;
  const W = 760, H = 340, L = 56, R = 120, T = 16, B = 40;
  const series = [["pgC", "--pg", "", "PG costed"], ["pgK", "--pg", "6 4", "PG kept"], ["calR", "--cal", "", "Calcite nodes"], ["calW", "--cal", "6 4", "Calcite winners"]];
  const vals = pts.flatMap(p => series.map(s => p[s[0]])).filter(v => v > 0);
  const lo = 1, hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...vals, 10))));
  const xs = pts.map(p => p.n), xmin = Math.min(...xs), xmax = Math.max(...xs);
  const X = n => L + (xmax === xmin ? 0.5 : (n - xmin) / (xmax - xmin)) * (W - L - R);
  const Y = v => T + (1 - (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo))) * (H - T - B);
  const sc = h("div", { class: "scroll" });
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;min-width:520px`, role: "img", "aria-label": "Line chart of plan counts by number of tables" });
  for (let e = 0; Math.pow(10, e) <= hi; e++) { const v = Math.pow(10, e), y = Y(v);
    el("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: css("--grid") }, svg);
    const t = el("text", { x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: css("--ink-3"), "font-family": css("--font-mono") }, svg); t.textContent = v >= 1000 ? (v / 1000) + "k" : v; }
  pts.forEach(p => { const t = el("text", { x: X(p.n), y: H - B + 18, "text-anchor": "middle", "font-size": 11.5, fill: css("--ink-2") }, svg); t.textContent = `${p.n} (${p.q})`; });
  const xl = el("text", { x: (L + W - R) / 2, y: H - 4, "text-anchor": "middle", "font-size": 11, fill: css("--ink-3") }, svg); xl.textContent = "tables joined";
  const labels = [];
  for (const [k, c, dash, name] of series) {
    const ps = pts.filter(p => p[k] > 0); if (!ps.length) continue;
    el("path", { d: ps.map((p, i) => `${i ? "L" : "M"}${X(p.n)},${Y(p[k])}`).join(" "), fill: "none", stroke: css(c), "stroke-width": 2, "stroke-dasharray": dash }, svg);
    ps.forEach(p => { const dot = el("circle", { cx: X(p.n), cy: Y(p[k]), r: 4.5, fill: css(c), stroke: css("--panel"), "stroke-width": 2 }, svg);
      const hit = el("circle", { cx: X(p.n), cy: Y(p[k]), r: 12, fill: "transparent" }, svg);
      hit.addEventListener("mousemove", e => showTip(e, `<b>${name}</b><br>${p.q}, ${p.n} table${p.n > 1 ? "s" : ""}: ${p[k]}`)); hit.addEventListener("mouseleave", hideTip); });
    const lp = ps[ps.length - 1]; labels.push({ y: Y(lp[k]), x: X(lp.n) + 10, text: `${name} ${lp[k]}`, c });
  }
  labels.sort((a, b) => a.y - b.y); for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
  labels.forEach(l => { const t = el("text", { x: l.x, y: l.y + 4, "font-size": 11.5, fill: css("--ink-2") }, svg); t.textContent = l.text; });
  sc.appendChild(svg); panel.appendChild(sc);
  panel.insertAdjacentHTML("beforeend", `<p class="note">PostgreSQL's "costed" includes paths thrown away by add_path_precheck before they were built. Calcite's "nodes" are RelNodes registered in the memo, logical and physical. These are not the same unit; compare how each grows with the number of tables.</p>`);
  main.appendChild(panel);
  const tp = h("section", { class: "panel" });
  tp.innerHTML = `<div class="ph"><h2>All queries</h2></div><div class="tbl"><table><thead><tr><th>Query</th><th>Tables</th><th>PG costed</th><th>PG precheck</th><th>PG rejected</th><th>PG evicted</th><th>PG kept</th><th>PG costed (native)</th><th>Calcite nodes</th><th>Calcite RelSets</th><th>Calcite rule firings</th><th>Calcite in plan</th></tr></thead><tbody>${qs.map(x => { const a = x.pg && x.pg.summary, n = x.pg_native && x.pg_native.summary, c = calOf(x) && calOf(x).summary; return `<tr><td>${x.q}</td><td class="num">${queryTables(x).length}</td><td class="num">${a ? a.considered : "–"}</td><td class="num">${a ? a.pruned_precheck : "–"}</td><td class="num">${a ? a.pruned_on_arrival : "–"}</td><td class="num">${a ? a.evicted_later : "–"}</td><td class="num">${a ? a.retained : "–"}</td><td class="num">${n ? n.considered : "–"}</td><td class="num">${c ? c.registered : "–"}</td><td class="num">${c ? c.relsets : "–"}</td><td class="num">${c ? c.rules_produced : "–"}</td><td class="num">${c ? c.chosen : "–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  main.appendChild(tp);
}

/* ---------- shell ---------- */
function buttons() {
  const qb = $("#qbtns"); qb.querySelectorAll("button").forEach(b => b.remove());
  for (const x of DATA.queries) { const b = h("button", { class: "chip", "aria-pressed": String(x.q === S.q) }, `${x.q}<small>${queryTables(x).length}T</small>`); b.onclick = () => { S.q = x.q; S.sel = null; S.tu = null; render(); }; qb.appendChild(b); }
  const vb = $("#vbtns"); vb.querySelectorAll("button").forEach(b => b.remove());
  for (const [id, label] of [["lattice", "Search space"], ["steps", "Step through"], ["counts", "Counts"]]) { const b = h("button", { class: "chip", "aria-pressed": String(S.view === id) }, label); b.onclick = () => { S.view = id; try { history.replaceState(null, "", "#" + id); } catch (e) {} render(); }; vb.appendChild(b); }
  const mb = $("#mbtns"); mb.querySelectorAll("button").forEach(b => b.remove());
  for (const [id, label] of [["pg", "index scans off"], ["pg_native", "native"]]) { const b = h("button", { class: "chip", "aria-pressed": String(S.mode === id) }, label); b.onclick = () => { S.mode = id; S.sel = null; render(); }; mb.appendChild(b); }
  const cb = $("#cbtns"); cb.querySelectorAll("button").forEach(b => b.remove());
  const x = DATA.queries.find(z => z.q === S.q), cur = calMode(x);
  for (const [id, label] of CMODES) { if (!x.cals[id]) continue; const b = h("button", { class: "chip", "aria-pressed": String(cur === id) }, label); b.onclick = () => { S.cmode = id; S.sel = null; S.tu = null; render(); }; cb.appendChild(b); }
}
function render() {
  if (S.playing) { cancelAnimationFrame(S.playing); S.playing = null; }
  buttons(); hideTip();
  $("#sql").textContent = Q().sql;
  $("#tleg").innerHTML = tableLegend(Q());
  const main = $("#main"); main.innerHTML = ""; main.style.display = "flex"; main.style.flexDirection = "column"; main.style.gap = "16px";
  if (S.view === "lattice") viewLattice(main); else if (S.view === "steps") viewSteps(main); else viewCounts(main);
}
window.addEventListener("hashchange", () => { const v = location.hash.replace("#", ""); if (["lattice", "steps", "counts"].includes(v) && v !== S.view) { S.view = v; render(); } });
render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
